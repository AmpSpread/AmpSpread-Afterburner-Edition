name: Build and release AmpSpread Afterburner Edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Run synthetic current-spread tests
        run: |
          cc -O2 -Wall -Wextra tests/test_spread.c -lm -o /tmp/test_spread
          /tmp/test_spread
      - name: Install Windows cross-linker
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y clang lld
      - name: Build Windows 32-bit plugin
        run: bash build-linux.sh
      - name: Validate Windows executable
        run: |
          file ampspread.dll
          test "$(head -c 2 ampspread.dll)" = "MZ"
          test -s ampspread.dll
      - name: Upload DLL as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: AmpSpread-Afterburner-Edition-v1.0.3
          path: ampspread.dll
          if-no-files-found: error
      - name: Produce SHA-256 checksum
        run: sha256sum ampspread.dll > ampspread.dll.sha256
      - name: Publish stable v1.0.3
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.3 >/dev/null 2>&1; then
            echo "Stable release v1.0.3 already exists; leaving it untouched."
          else
            gh release create v1.0.3 ampspread.dll ampspread.dll.sha256 \
              --title "AmpSpread Afterburner Edition v1.0.3" \
              --latest \
              --notes-file RELEASE_NOTES_v1.0.3.md \
              --target "$GITHUB_SHA"
          fi
